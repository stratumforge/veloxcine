<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to VeloxCine Secure Checkout...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/icon128.png">
  <style>
    body {
      background-color: #0a0e17;
      color: #00e5ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #94a3b8; font-size: 15px; }
    a { color: #00e5ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Connecting to Secure Checkout...</h2>
  <p>If you are not redirected automatically in 2 seconds, <a id="manual-link" href="https://test.checkout.dodopayments.com/buy/pdt_0Nna7ANhDbXXOE7kjmtdA?quantity=1">click here to proceed</a>.</p>

  <script>
    (async function redirect() {
      const dodoInr = "https://test.checkout.dodopayments.com/buy/pdt_0Nna6rkOllUVOkzJZyjJH?quantity=1";
      const dodoUsd = "https://test.checkout.dodopayments.com/buy/pdt_0Nna7ANhDbXXOE7kjmtdA?quantity=1";
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      const isIndianTz = tz.includes('Kolkata') || tz.includes('Calcutta') || tz.includes('India');
      let target = isIndianTz ? dodoInr : dodoUsd;

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1500);
        const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
        clearTimeout(timeout);
        if (res.ok) {
          const data = await res.json();
          if (data.country_code === 'IN') {
            target = dodoInr;
          } else {
            target = dodoUsd;
          }
        }
      } catch (e) {}

      const manualLink = document.getElementById('manual-link');
      if (manualLink) manualLink.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
